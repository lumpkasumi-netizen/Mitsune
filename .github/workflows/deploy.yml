name: Deploy production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mitsune-production
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 scripts/site_sync.py validate
      - run: python3 -m unittest discover -s tests_portable -v
      - run: find site/theme -name '*.php' -print0 | xargs -0 -n 1 php -l
      - run: find site/theme -name '*.js' -print0 | xargs -0 -n 1 node --check
      - run: python3 scripts/check_repository.py
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mitsune-ai.com/
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish validated revision for server polling
        id: ready
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'superseded=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "$GITHUB_SHA:refs/heads/production-ready"
      - name: Wait for verified server publication
        if: steps.ready.outputs.superseded != 'true'
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ['EXPECTED_REVISION']
          for attempt in range(60):
              latest = os.popen('git ls-remote origin refs/heads/main').read().split()[0]
              if latest != expected:
                  print('Superseded by a newer main revision.'); break
              try:
                  url = 'https://mitsune-ai.com/.well-known/mitsune-deployment.json?t=' + str(time.time_ns())
                  with urllib.request.urlopen(url, timeout=15) as response:
                      report = json.load(response)
                  if report.get('source_commit') == expected and report.get('status') == 'verified':
                      print('Server read-back and public HTTP checks passed:', expected); break
              except (OSError, ValueError):
                  pass
              time.sleep(10)
          else:
              raise SystemExit('No verified server publication within 10 minutes; inspect server deployment log.')
          PY
